<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050510">
<title>NEON DODGE 2.0</title>
<style>
:root{--c:#50faff;--bg:#050510}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f3f6ff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;inset:0;padding:17px;pointer-events:none}
.top{display:flex;align-items:flex-start;justify-content:space-between}
.logo{font-weight:900;font-size:17px;letter-spacing:3px;color:var(--c);text-shadow:0 0 15px var(--c)}
.sub{font-size:9px;color:#858cae;letter-spacing:2px;margin-top:5px}
.score{text-align:right;font-size:25px;font-weight:900}
.coinline{color:#ffd76a;font-size:12px;margin-top:4px}
#pause{pointer-events:auto;border:1px solid #343b60;border-radius:8px;background:#11142b;color:var(--c);padding:8px 11px;margin-top:12px}
#bossbar{position:absolute;top:102px;left:22%;width:56%;height:7px;border:1px solid #ff4c89;border-radius:8px;overflow:hidden;display:none}
#bossfill{width:100%;height:100%;background:#ff367f;box-shadow:0 0 10px #ff367f}
#worldname{position:absolute;top:83px;left:17px;font-size:9px;letter-spacing:2px;color:var(--c)}
#power{position:absolute;top:118px;left:17px;font-size:10px;line-height:1.7;color:#a9faff}
#panel{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px;background:#03040cc9;overflow-y:auto}
.card{width:100%;max-width:390px;max-height:94dvh;overflow-y:auto;text-align:center;background:linear-gradient(155deg,#11162bfa,#080916fa);border:1px solid #303858;border-radius:19px;padding:26px 21px;box-shadow:0 0 55px #18244b50}
.tag{font-size:10px;color:#8993b9;letter-spacing:3px;margin-bottom:13px}
h1{font-size:clamp(32px,9vw,46px);line-height:.98;letter-spacing:-2px;margin:0 0 13px;font-weight:1000}
.neon{color:var(--c);text-shadow:0 0 22px var(--c)}
.desc{font-size:13px;color:#a7afca;line-height:1.65;margin:12px 0 20px}
.btn{display:block;width:100%;border:1px solid #3c466c;background:#151b33;color:#eaf8ff;border-radius:9px;padding:13px 12px;margin-top:9px;font-weight:bold;letter-spacing:1px;font-size:12px}
.btn.primary{background:var(--c);color:#030611;border-color:var(--c);box-shadow:0 0 20px #50faff33}
.btn:disabled{opacity:.35}
.row{display:flex;gap:9px}
.row .btn{flex:1}
.small{font-size:10px;letter-spacing:1px;color:#737d9e;margin-top:16px;line-height:1.7}
.hidden{display:none!important}
#controls{position:fixed;bottom:max(17px,env(safe-area-inset-bottom));left:0;right:0;padding:0 18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.move{pointer-events:auto;width:68px;height:59px;border:1px solid #50faff77;border-radius:15px;background:#11182dcc;color:var(--c);font-size:25px}
.rightcontrols{display:flex;gap:8px;align-items:end}
.action{pointer-events:auto;min-width:65px;height:53px;padding:0 10px;border:1px solid #ff4eaa88;border-radius:13px;background:#29132bcc;color:#ff75bd;font-size:10px;font-weight:bold}
#ability{border-color:#50faff88;background:#101f30dd;color:var(--c)}
#hint{position:fixed;bottom:92px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:2px;color:#5c6588;pointer-events:none}
.skinlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;text-align:left}
.skin{padding:11px;border:1px solid #303957;border-radius:10px;background:#0b1020;min-width:0}
.skinname{font-size:12px;font-weight:bold;margin:7px 0}
.skinprice{font-size:10px;color:#ffd76a}
.skin button{width:100%;margin-top:9px;padding:9px 3px;font-size:10px}
.shipicon{width:24px;height:29px;clip-path:polygon(50% 0,100% 90%,50% 70%,0 90%);margin:0 auto;filter:drop-shadow(0 0 8px currentColor)}
.setting{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#c1c9e0;padding:10px 0;border-bottom:1px solid #222b46}
.setting input{accent-color:var(--c);width:18px;height:18px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="top">
  <div><div class="logo">NEON DODGE <span style="font-size:10px">2.0</span></div>
  <div class="sub" id="subtitle">SURVIVE THE GRID</div></div>
  <div>
   <div class="score" id="score">0</div>
   <div class="coinline">◆ <span id="coins">0</span></div>
   <div class="sub" style="text-align:right">BEST <span id="best">0</span></div>
   <button id="pause" class="hidden">Ⅱ PAUSE</button>
  </div>
 </div>
 <div id="worldname">WORLD 01 // CYBER GRID</div>
 <div id="bossbar"><div id="bossfill"></div></div>
 <div id="power"></div>
</div>

<div id="panel">
 <div class="card" id="card"></div>
</div>

<div id="hint" class="hidden">DRAG TO MOVE · AVOID THE NEON</div>
<div id="controls" class="hidden">
 <button class="move" id="left">‹</button>
 <div class="rightcontrols">
  <button class="action" id="ability">SHIELD<br>READY</button>
  <button class="action" id="dash">DASH<br>READY</button>
  <button class="move" id="right">›</button>
 </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const panel=$('panel'),card=$('card');
const KEY='neondodge_v2_save';
const skins=[
 {id:'cyan',name:'CYBER',color:'#50faff',cost:0},
 {id:'pink',name:'NEON ROSE',color:'#ff55bc',cost:60},
 {id:'gold',name:'SOLAR',color:'#ffd65a',cost:140},
 {id:'green',name:'TOXIC',color:'#83ff73',cost:220},
 {id:'purple',name:'VOID',color:'#ad83ff',cost:350},
 {id:'red',name:'INFERNO',color:'#ff4e68',cost:500}
];
const worlds=[
 {name:'CYBER GRID',color:'#50faff',hue:185},
 {name:'VOID CITY',color:'#b17aff',hue:270},
 {name:'INFERNO CORE',color:'#ff527d',hue:345}
];
let save;
function load(){
 try{save=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!save||typeof save!=='object')save={coins:0,best:0,owned:['cyan'],skin:'cyan',runs:0,kills:0,sound:true,shake:true};
 save.coins=Math.max(0,Number(save.coins)||0);
 save.best=Number(save.best)||0;
 save.owned=Array.isArray(save.owned)?save.owned:['cyan'];
 if(!save.owned.includes('cyan'))save.owned.push('cyan');
 if(!skins.some(s=>s.id===save.skin)||!save.owned.includes(save.skin))save.skin='cyan';
 if(save.sound===undefined)save.sound=true;
 if(save.shake===undefined)save.shake=true;
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
load();

let W=innerWidth,H=innerHeight,D=1,last=0,mode='menu';
let player,obstacles,pickups,particles,stars,bullets;
let elapsed=0,score=0,runCoins=0,spawn=0,pickupSpawn=0;
let shake=0,slow=0,shield=0,dashTime=0,dashCooldown=0;
let move=0,dragging=false,prevX=0;
let boss=null,nextBoss=60,world=0,worldNotice=0;
let soundCtx=null,muted=!save.sound;
let pointerDown=false;

function resize(){
 D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=W*D;canvas.height=H*D;
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(D,0,0,D,0,0);
 stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*1.5+.3,a:.15+Math.random()*.65}));
 if(player){player.x=Math.max(15,Math.min(W-15,player.x));player.y=H*.76}
 draw();
}
addEventListener('resize',resize);

function audio(freq=500,dur=.08,type='sine',vol=.035){
 if(muted)return;
 try{
  soundCtx=soundCtx||new(window.AudioContext||window.webkitAudioContext)();
  if(soundCtx.state==='suspended')soundCtx.resume();
  let o=soundCtx.createOscillator(),g=soundCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,soundCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.55),soundCtx.currentTime+dur);
  g.gain.setValueAtTime(vol,soundCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,soundCtx.currentTime+dur);
  o.connect(g);g.connect(soundCtx.destination);o.start();o.stop(soundCtx.currentTime+dur);
 }catch(e){}
}
function sfx(type){
 if(type==='coin'){audio(1050,.06,'sine',.035);setTimeout(()=>audio(1450,.08,'sine',.025),45)}
 if(type==='power')audio(700,.24,'triangle',.05);
 if(type==='hit'){audio(120,.35,'sawtooth',.06)}
 if(type==='boss'){audio(100,.5,'sawtooth',.05)}
 if(type==='win'){audio(450,.2);setTimeout(()=>audio(800,.22),130)}
 if(type==='dash')audio(260,.14,'triangle',.05);
}
function color(){return skins.find(s=>s.id===save.skin)?.color||'#50faff'}
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function burst(x,y,c,n=18){
 for(let i=0;i<n;i++){
  let a=Math.random()*Math.PI*2,s=rand(40,260),life=rand(.22,.8);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   r:rand(1,3.6),life,max:life,c});
 }
}
function reset(){
 elapsed=0;score=0;runCoins=0;spawn=.3;pickupSpawn=1.5;
 obstacles=[];pickups=[];particles=[];bullets=[];
 boss=null;nextBoss=60;world=0;worldNotice=2.5;
 shield=0;slow=0;dashTime=0;dashCooldown=0;shake=0;move=0;
 player={x:W/2,y:H*.76,r:11,inv:1};
}
function showMenu(){
 mode='menu';panel.classList.remove('hidden');
 $('controls').classList.add('hidden');$('hint').classList.add('hidden');
 $('pause').classList.add('hidden');$('bossbar').style.display='none';
 card.innerHTML=`
 <div class="tag">ARCADE SYSTEM // 002</div>
 <h1>NEON<br><span class="neon">DODGE</span></h1>
 <div style="color:#7783a9;font-size:11px;letter-spacing:3px">VERSION 2.0</div>
 <p class="desc">Dodge the grid. Collect energy coins.<br>Survive the bosses. Own the neon.</p>
 <div class="row">
 <button class="btn primary" id="play">▶ PLAY</button>
 <button class="btn" id="shop">◆ SHIP SHOP</button>
 </div>
 <div class="row">
 <button class="btn" id="stats">STATS</button>
 <button class="btn" id="settings">SETTINGS</button>
 </div>
 <div class="small">◆ ${save.coins} COINS &nbsp; / &nbsp; BEST ${save.best}<br>YOUR PROGRESS SAVES AUTOMATICALLY</div>`;
 $('play').onclick=startGame;$('shop').onclick=showShop;
 $('stats').onclick=showStats;$('settings').onclick=showSettings;
}
function startGame(){
 reset();mode='playing';panel.classList.add('hidden');
 $('controls').classList.remove('hidden');$('hint').classList.remove('hidden');
 $('pause').classList.remove('hidden');$('subtitle').textContent='SURVIVE THE GRID';
 audio(520,.12);
 last=performance.now();
}
function pauseGame(){
 if(mode==='playing'){
  mode='paused';panel.classList.remove('hidden');
  card.innerHTML=`<div class="tag">SYSTEM PAUSED</div><h1>TAKE A<br><span class="neon">BREATHER</span></h1>
  <p class="desc">Score ${score} · ${runCoins} coins this run</p>
  <button class="btn primary" id="resume">RESUME</button>
  <button class="btn" id="quit">QUIT RUN</button>`;
  $('resume').onclick=()=>{mode='playing';panel.classList.add('hidden');last=performance.now()};
  $('quit').onclick=()=>{finish(false);showMenu()};
 }else if(mode==='paused'){
  mode='playing';panel.classList.add('hidden');last=performance.now();
 }
}
function showShop(){
 mode='shop';panel.classList.remove('hidden');
 $('controls').classList.add('hidden');$('hint').classList.add('hidden');
 card.innerHTML=`<div class="tag">SHIP HANGAR // SKINS</div>
 <h1>CHOOSE YOUR<br><span class="neon">SHIP</span></h1>
 <p class="desc">◆ ${save.coins} coins available</p>
 <div class="skinlist" id="skinlist"></div>
 <button class="btn" id="back">← BACK TO MENU</button>`;
 const list=$('skinlist');
 skins.forEach(s=>{
  let owned=save.owned.includes(s.id),active=save.skin===s.id;
  let item=document.createElement('div');item.className='skin';
  item.innerHTML=`<div class="shipicon" style="background:${s.color};color:${s.color}"></div>
   <div class="skinname">${s.name}${active?' ✓':''}</div>
   <div class="skinprice">${owned?'UNLOCKED':'◆ '+s.cost+' COINS'}</div>
   <button class="btn ${active?'primary':''}" ${active?'disabled':''}>${active?'EQUIPPED':owned?'EQUIP':'UNLOCK'}</button>`;
  item.querySelector('button').onclick=()=>{
   if(owned){save.skin=s.id;persist();showShop();audio(600,.08)}
   else if(save.coins>=s.cost){save.coins-=s.cost;save.owned.push(s.id);save.skin=s.id;persist();showShop();sfx('coin')}
   else{audio(120,.12,'square');item.querySelector('.skinprice').textContent='NOT ENOUGH COINS'}
  };
  list.appendChild(item);
 });
 $('back').onclick=showMenu;
}
function showStats(){
 mode='stats';panel.classList.remove('hidden');
 card.innerHTML=`<div class="tag">PILOT RECORD</div><h1>YOUR<br><span class="neon">STATS</span></h1>
 <p class="desc">BEST SCORE: <b>${save.best}</b><br>TOTAL COINS: <b>${save.coins}</b><br>RUNS STARTED: <b>${save.runs}</b><br>BOSSES DEFEATED: <b>${save.kills}</b><br>SHIPS OWNED: <b>${save.owned.length}/${skins.length}</b></p>
 <button class="btn" id="back">← BACK</button>`;
 $('back').onclick=showMenu;
}
function showSettings(){
 mode='settings';panel.classList.remove('hidden');
 card.innerHTML=`<div class="tag">SYSTEM CONFIGURATION</div><h1>SETTINGS</h1>
 <div class="setting"><span>Sound effects</span><input id="sound" type="checkbox" ${save.sound?'checked':''}></div>
 <div class="setting"><span>Screen shake</span><input id="shakecheck" type="checkbox" ${save.shake?'checked':''}></div>
 <p class="desc">Progress and purchases are stored on this device.</p>
 <button class="btn" id="resetdata">RESET ALL SAVE DATA</button>
 <button class="btn primary" id="back">DONE</button>`;
 $('sound').onchange=e=>{save.sound=e.target.checked;muted=!save.sound;persist();if(save.sound)audio(500,.1)};
 $('shakecheck').onchange=e=>{save.shake=e.target.checked;persist()};
 $('resetdata').onclick=()=>{
  if(confirm('Delete all coins, skins and records?')){
   localStorage.removeItem(KEY);load();muted=!save.sound;showSettings();
  }
 };
 $('back').onclick=showMenu;
}
function finish(saveRun=true){
 mode='over';$('controls').classList.add('hidden');$('hint').classList.add('hidden');
 $('pause').classList.add('hidden');$('bossbar').style.display='none';
 if(saveRun){
  save.coins+=runCoins;save.best=Math.max(save.best,score);persist();
 }
 panel.classList.remove('hidden');
 card.innerHTML=`<div class="tag">RUN TERMINATED</div><h1>GAME<br><span class="neon">OVER</span></h1>
 <p class="desc">SCORE <b style="color:${color()}">${score}</b><br>
 ◆ ${runCoins} coins collected<br>PERSONAL BEST: ${save.best}</p>
 <button class="btn primary" id="again">↻ PLAY AGAIN</button>
 <button class="btn" id="shop">◆ SHIP SHOP</button>
 <button class="btn" id="menu">MAIN MENU</button>`;
 $('again').onclick=startGame;$('shop').onclick=showShop;$('menu').onclick=showMenu;
}
function addCoin(x,y,value=1){
 pickups.push({x,y,r:value===5?10:7,type:'coin',value,vy:95,phase:Math.random()*6});
}
function spawnPower(){
 let types=['shield','slow','dash','magnet'];
 let type=types[Math.floor(Math.random()*types.length)];
 pickups.push({x:rand(25,W-25),y:-20,r:11,type,value:0,vy:100,phase:0});
}
function spawnObstacle(){
 if(boss&&boss.active)return;
 let w=rand(25,65),h=rand(13,23);
 let x=rand(w/2+3,W-w/2-3);
 obstacles.push({x,y:-h,w,h,vy:rand(0,35),hue:worlds[world].hue+(Math.random()>.5?35:-20)});
}
function spawnBoss(){
 boss={active:true,hp:100,max:100,x:W/2,y:105,r:27,t:0,attack:1.1,phase:0};
 obstacles=[];
 sfx('boss');shake=8;worldNotice=3;
 $('subtitle').textContent='WARNING // BOSS INBOUND';
}
function bossAttack(dt){
 if(!boss)return;
 boss.t+=dt;boss.attack-=dt;
 boss.x=W/2+Math.sin(boss.t*1.25)*Math.min(W*.34,125);
 boss.y=92+Math.sin(boss.t*2)*12;
 if(boss.attack<=0){
  boss.attack= Math.max(.38, .95-elapsed*.001);
  let a=Math.atan2(player.y-boss.y,player.x-boss.x);
  bullets.push({x:boss.x,y:boss.y+15,vx:Math.cos(a)*220,vy:Math.sin(a)*220,r:7,c:'#ff4d92'});
  if(boss.t>4){
   for(let i=-1;i<=1;i++){
    let an=a+i*.27;
    bullets.push({x:boss.x,y:boss.y+15,vx:Math.cos(an)*180,vy:Math.sin(an)*180,r:5,c:'#ff4d92'});
   }
  }
 }
 boss.hp=Math.max(0,100-boss.t/14*100);
 $('bossbar').style.display='block';$('bossfill').style.width=boss.hp+'%';
 if(boss.t>=14){
  boss=null;bullets=[];nextBoss=elapsed+60;save.kills++;persist();
  let bonus=25;runCoins+=bonus;burst(W/2,100,'#ff4d92',50);sfx('win');shake=10;
  worldNotice=3;$('subtitle').textContent='BOSS DEFEATED // +25 BONUS COINS';
  $('bossbar').style.display='none';
 }
}
function pickupEffect(p){
 if(p.type==='coin'){
  runCoins+=p.value;score+=p.value*5;sfx('coin');burst(p.x,p.y,'#ffd65a',9);
 }else{
  sfx('power');burst(p.x,p.y,'#6efaff',15);
  if(p.type==='shield')shield=7;
  if(p.type==='slow')slow=5;
  if(p.type==='dash'){dashTime=2.4;dashCooldown=0}
  if(p.type==='magnet')player.magnet=8;
 }
}
function hit(){
 if(player.inv>0||dashTime>0)return;
 if(shield>0){
  shield=0;player.inv=1.1;burst(player.x,player.y,'#50faff',24);sfx('power');shake=5;return;
 }
 burst(player.x,player.y,color(),35);sfx('hit');shake=14;
 finish(true);
}
function collide(a,b){
 return Math.abs(a.x-b.x)<(a.w||a.r*2)/2+(b.w||b.r*2)/2-2&&
        Math.abs(a.y-b.y)<(a.h||a.r*2)/2+(b.h||b.r*2)/2-2;
}
function update(dt){
 if(mode!=='playing')return;
 elapsed+=dt;
 let activeDt=slow>0?dt*.52:dt;
 if(slow>0)slow=Math.max(0,slow-dt);
 if(shield>0)shield=Math.max(0,shield-dt);
 if(dashTime>0)dashTime=Math.max(0,dashTime-dt);
 if(dashCooldown>0)dashCooldown=Math.max(0,dashCooldown-dt);
 if(player.inv>0)player.inv-=dt;
 if(player.magnet>0)player.magnet-=dt;
 score=Math.floor(elapsed*10);
 if(elapsed>=20&&elapsed<45)world=1;
 else if(elapsed>=45)world=2;
 if(worldNotice>0)worldNotice-=dt;
 document.documentElement.style.setProperty('--c',worlds[world].color);
 $('score').textContent=score;
 $('coins').textContent=save.coins+runCoins;
 $('best').textContent=Math.max(save.best,score);
 $('worldname').textContent='WORLD 0'+(world+1)+' // '+worlds[world].name;
 $('subtitle').textContent=boss?'BOSS BATTLE // SURVIVE':'SURVIVE THE GRID';
 let dx=move*350;
 player.x=clamp(player.x+dx*dt,14,W-14);
 if(player.magnet>0){
  for(let p of pickups)if(p.type==='coin'){
   let d=Math.hypot(player.x-p.x,player.y-p.y);
   if(d<150){p.x+=(player.x-p.x)*dt*2.7;p.y+=(player.y-p.y)*dt*2.7}
  }
 }
 spawn-=activeDt;
 if(spawn<=0){
  spawn=Math.max(.2,.68-elapsed*.004)*rand(.7,1.2);
  spawnObstacle();
  if(Math.random()<.20)addCoin(rand(25,W-25),-10);
 }
 pickupSpawn-=dt;
 if(pickupSpawn<=0){pickupSpawn=rand(9,15);if(Math.random()<.85)spawnPower()}
 if(elapsed>=nextBoss&&!boss)spawnBoss();
 if(boss)bossAttack(activeDt);

 let velocity=(220+Math.min(elapsed*5,300))*(slow>0?.55:1);
 for(let o of obstacles){
  o.y+=(velocity+o.vy)*dt;
  if(collide({x:player.x,y:player.y,r:player.r*1.2},o))hit();
 }
 obstacles=obstacles.filter(o=>o.y<H+60);
 for(let p of pickups){
  p.y+=p.vy*dt;p.phase+=dt*4;
  if(collide({x:player.x,y:player.y,r:player.r+2},p))pickupEffect(p);
 }
 pickups=pickups.filter(p=>p.y<H+35);
 for(let b of bullets){
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(collide({x:player.x,y:player.y,r:player.r},b))hit();
 }
 bullets=bullets.filter(b=>b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
 for(let p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);
 if(shake>0)shake=Math.max(0,shake-30*dt);
}
function drawShip(x,y,r,c){
 ctx.save();ctx.translate(x,y);
 if(player&&(shield>0||dashTime>0)){
  ctx.beginPath();ctx.arc(0,0,r+8+Math.sin(performance.now()*.012)*2,0,Math.PI*2);
  ctx.strokeStyle=shield>0?'#50faff':'#ff55bc';ctx.lineWidth=2;
  ctx.shadowBlur=15;ctx.shadowColor=ctx.strokeStyle;ctx.stroke();
 }
 ctx.shadowBlur=23;ctx.shadowColor=c;ctx.fillStyle=c;
 ctx.beginPath();ctx.moveTo(0,-r-4);ctx.lineTo(r, r);ctx.lineTo(0,r*.58);ctx.lineTo(-r,r);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff';ctx.fillRect(-2,-2,4,7);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
 let sx=0,sy=0;
 if(shake>0&&save.shake&&mode==='playing'){sx=rand(-shake,shake);sy=rand(-shake,shake)}
 ctx.save();ctx.translate(sx,sy);
 for(let s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#aab9e8';ctx.fillRect(s.x,s.y,s.r,s.r)}
 ctx.globalAlpha=1;
 ctx.strokeStyle='#151a34';ctx.lineWidth=1;
 let off=(performance.now()*.025)%42;
 for(let x=0;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=off;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let o of obstacles){
  let c='hsl('+o.hue+',100%,65%)';ctx.save();ctx.shadowBlur=18;ctx.shadowColor=c;
  ctx.fillStyle=c;ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);ctx.restore();
 }
 for(let p of pickups){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.phase||0);
  let c=p.type==='coin'?'#ffd65a':p.type==='shield'?'#50faff':p.type==='slow'?'#b17aff':p.type==='dash'?'#ff55bc':'#83ff73';
  ctx.shadowBlur=18;ctx.shadowColor=c;ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=2;
  if(p.type==='coin'){
   ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.stroke();
   ctx.fillStyle=c;ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('◆',0,0);
  }else{
   ctx.strokeRect(-p.r,-p.r,p.r*2,p.r*2);
   ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText(p.type==='shield'?'S':p.type==='slow'?'T':p.type==='dash'?'D':'M',0,0);
  }
  ctx.restore();
 }
 for(let b of bullets){
  ctx.save();ctx.fillStyle=b.c;ctx.shadowBlur=20;ctx.shadowColor=b.c;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 if(boss){
  ctx.save();ctx.translate(boss.x,boss.y);
  ctx.shadowBlur=35;ctx.shadowColor='#ff367f';ctx.fillStyle='#ff367f';
  ctx.beginPath();ctx.moveTo(0,-32);ctx.lineTo(32,-10);ctx.lineTo(23,25);
  ctx.lineTo(0,34);ctx.lineTo(-23,25);ctx.lineTo(-32,-10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#25051a';ctx.fillRect(-17,-4,34,9);
  ctx.fillStyle='#fff';ctx.fillRect(-12,-2,7,4);ctx.fillRect(5,-2,7,4);
  ctx.restore();
 }
 for(let p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;
  ctx.shadowBlur=10;ctx.shadowColor=p.c;ctx.fillRect(p.x,p.y,p.r,p.r);
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 if(player){
  if(player.inv<=0||Math.floor(performance.now()/90)%2===0)
   drawShip(player.x,player.y,player.r,color());
 }
 if(worldNotice>0&&mode==='playing'&&!boss){
  ctx.globalAlpha=Math.min(1,worldNotice);ctx.textAlign='center';
  ctx.font='bold 13px Arial';ctx.fillStyle=worlds[world].color;
  ctx.shadowBlur=20;ctx.shadowColor=worlds[world].color;
  ctx.fillText(worlds[world].name,W/2,H*.35);ctx.globalAlpha=1;ctx.shadowBlur=0;
 }
 ctx.restore();
}
function loop(now){
 requestAnimationFrame(loop);
 let dt=Math.min((now-last)/1000,.04);last=now;
 if(mode==='playing')update(dt);
 draw();
 if(mode==='playing'){
  $('power').innerHTML=[
   shield>0?'SHIELD '+shield.toFixed(1)+'s':'',
   slow>0?'SLOW TIME '+slow.toFixed(1)+'s':'',
   player&&player.magnet>0?'MAGNET '+player.magnet.toFixed(1)+'s':'',
   dashTime>0?'DASH ACTIVE':''
  ].filter(Boolean).join('<br>');
  $('ability').innerHTML=shield>0?'SHIELD<br>'+shield.toFixed(1)+'s':'SHIELD<br>READY';
  $('dash').innerHTML=dashTime>0?'DASH<br>ACTIVE':dashCooldown>0?'DASH<br>'+dashCooldown.toFixed(1)+'s':'DASH<br>READY';
  $('ability').style.opacity=shield>0?'.9':'.75';
  $('dash').style.opacity=dashCooldown>0?'.45':'1';
 }
}
function setMove(v){move=v}
function holdButton(id,v){
 let el=$(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();setMove(v)});
 for(let ev of ['pointerup','pointercancel','pointerleave'])
  el.addEventListener(ev,()=>{if(move===v)setMove(0)});
}
holdButton('left',-1);holdButton('right',1);
canvas.addEventListener('pointerdown',e=>{
 if(mode!=='playing')return;
 dragging=true;prevX=e.clientX;player.x=clamp(e.clientX,14,W-14);
});
canvas.addEventListener('pointermove',e=>{
 if(!dragging||mode!=='playing')return;
 player.x=clamp(e.clientX,14,W-14);prevX=e.clientX;
});
addEventListener('pointerup',()=>{dragging=false});
addEventListener('pointercancel',()=>{dragging=false});
$('ability').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(mode!=='playing')return;
 if(shield<=0){shield=5;sfx('power');burst(player.x,player.y,'#50faff',12)}
});
$('dash').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(mode!=='playing'||dashCooldown>0)return;
 dashTime=1.1;dashCooldown=7;player.inv=Math.max(player.inv,.35);
 sfx('dash');burst(player.x,player.y,color(),20);
});
$('pause').onclick=pauseGame;
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')move=-1;
 if(e.key==='ArrowRight'||e.key==='d')move=1;
 if(e.key===' '){e.preventDefault();if(mode==='playing'||mode==='paused')pauseGame()}
 if(e.key==='Shift'&&mode==='playing'&&dashCooldown<=0){
  dashTime=1.1;dashCooldown=7;sfx('dash');player.inv=.4;
 }
});
addEventListener('keyup',e=>{
 if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))move=0;
});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&mode==='playing')pauseGame();
});
reset();resize();showMenu();last=performance.now();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
